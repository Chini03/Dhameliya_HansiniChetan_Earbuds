<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./css/main.css" rel="stylesheet"/>
  </head>
  <body>
    <!-- <model-viewer> HTML element -->
    <div class="model-container">
      <model-viewer src="model/single star.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="images/poster.webp" shadow-intensity="1">
        <button class="Hotspot" slot="hotspot-1" data-position="-0.0242041676063615m -0.00045773742039532245m 0.10815885251750275m" data-normal="0.7391703989792071m -0.09374305868779184m 0.6669627877331515m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation" id="hotspot-1">
            </div>
        </button>
        <button class="Hotspot" slot="hotspot-2" data-position="0.07213234525586523m 0.0303434994921608m -0.07582303859794998m" data-normal="0.3190764984948867m 0.1036742546326546m -0.9420413138682434m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation" id="hotspot-2">
            </div>
        </button>
        <button class="Hotspot" slot="hotspot-3" data-position="-0.00044504867997721687m -0.0820666299133061m -0.0012798607324178077m" data-normal="0m -0.17364818477387206m 0.9848077517590627m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation" id="hotspot-3">
            </div>
        </button>
      </model-viewer> 
    </div> 

    <div class="annotations-mobile">
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

    <script src="js/script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  </body>
</html>
